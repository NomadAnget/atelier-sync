name: Collaboration reconciliation
on:
  repository_dispatch:
    types: [sync]
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply only after the migration gate is approved
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: atelier-coordinator
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || vars.COORDINATOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv --python 3.11 .venv
      - name: Test the trusted coordinator
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Reconcile live repositories
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          FORGEJO_SYNC_TOKEN: ${{ secrets.FORGEJO_SYNC_TOKEN }}
          COORDINATOR_ENABLED: ${{ vars.COORDINATOR_ENABLED }}
          COORDINATOR_TRUSTED_SHA: ${{ vars.COORDINATOR_TRUSTED_SHA }}
          REQUEST_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=(--dry-run)
          if [[ "$COORDINATOR_ENABLED" == "true" && "$REQUEST_APPLY" == "true" ]]; then
            [[ "$GITHUB_SHA" == "$COORDINATOR_TRUSTED_SHA" ]] || { echo "Unapproved coordinator revision"; exit 1; }
            args=(--apply)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then args+=(--event "$GITHUB_EVENT_PATH"); fi
          .venv/bin/python coordinator.py "${args[@]}"

