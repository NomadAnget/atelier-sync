name: Collaboration reconciliation
on:
  repository_dispatch:
    types: [sync]
  workflow_dispatch:
    inputs:
      repository:
        type: choice
        options: [atelier-studio, atelier-reel-solo]
        default: atelier-studio
        description: Registered variant for this manual run
      ci_pr:
        type: string
        default: ""
        description: Selected variant PR number for composition CI verification
      apply:
        type: boolean
        default: false
        description: Apply only after the migration gate is approved
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: atelier-coordinator
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || vars.COORDINATOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv --python 3.11 .venv
      - name: Test the trusted coordinator
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Reconcile live repositories
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          FORGEJO_SYNC_TOKEN: ${{ secrets.FORGEJO_SYNC_TOKEN }}
          COORDINATOR_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply && inputs.repository == 'atelier-reel-solo') && 'true' || vars.COORDINATOR_ENABLED }}
          COORDINATOR_TRUSTED_SHA: ${{ vars.COORDINATOR_TRUSTED_SHA }}
          SELECTED_REPOSITORY: ${{ inputs.repository }}
          REQUEST_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=(--dry-run)
          if [[ "$COORDINATOR_ENABLED" == "true" && "$REQUEST_APPLY" == "true" ]]; then
            [[ "$GITHUB_SHA" == "$COORDINATOR_TRUSTED_SHA" ]] || { echo "Unapproved coordinator revision"; exit 1; }
            args=(--apply)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then args+=(--event "$GITHUB_EVENT_PATH"); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then args+=(--only "$SELECTED_REPOSITORY"); fi
          .venv/bin/python coordinator.py "${args[@]}"
      - name: Request selected variant composition CI for the current PR head and base
        if: github.event_name == 'workflow_dispatch' && inputs.ci_pr != ''
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          SELECTED_REPOSITORY: ${{ inputs.repository }}
          CI_PR: ${{ inputs.ci_pr }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from coordination.api import Api
          from coordination.registry import Registry
          value = os.environ['CI_PR']
          if not value.isdecimal() or int(value) < 1:
              raise ValueError('Invalid variant PR number')
          api = Api('github')
          registered = next(r for r in Registry.load('registry.json').repos if r.name == os.environ['SELECTED_REPOSITORY'])
          if not registered.enabled or not registered.public_variant_ci:
              raise ValueError('Variant CI is not activated')
          repo = registered.github_name
          pr = api.request('GET', f'/repos/{repo}/pulls/{int(value)}')
          if pr['state'] != 'open' or pr['head']['repo']['id'] != registered.github_id or pr['base']['ref'] != 'master':
              raise ValueError('Only an open variant-owned PR targeting master is allowed')
          base = api.request('GET', f'/repos/{repo}/git/ref/heads/master')['object']['sha']
          api.request('POST', f'/repos/{repo}/dispatches', {'event_type': 'atelier_ci',
              'client_payload': {'repository': repo, 'pr': int(value), 'head_sha': pr['head']['sha'], 'base_sha': base}})
          PY
