name: Coordinator checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv --python 3.11 .venv
      - run: mkdir -p tmp
      - name: Test coordinator without credentials or live writes
        run: .venv/bin/python -m unittest discover -s tests -v
