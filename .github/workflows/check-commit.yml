name: Check submitted commit
on:
  repository_dispatch:
    types: [atelier_check, atelier-submodule-pr, atelier_submodule_pr]
  workflow_dispatch:
    inputs:
      repository:
        description: Changed owner/repository
        required: true
        type: string
      sha:
        description: Full source commit SHA
        required: true
        type: string
      pr_number:
        description: Optional child PR number to validate before checking
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Validate notified child PR
        if: github.event_name == 'repository_dispatch' && github.event.action != 'atelier_check'
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.child_repo || github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.head_sha || github.event.client_payload.sha }}
          SOURCE_PR: ${{ github.event.client_payload.pr_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ['SOURCE_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          number = os.environ['SOURCE_PR']
          if not re.fullmatch(r'NomadAnget/atelier-[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Rejected: child repository is outside the Atelier owner namespace.')
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not number.isdigit():
              raise SystemExit('Rejected: dispatch must contain a full head SHA and PR number.')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  pr = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              raise SystemExit(f'Could not verify child PR: {exc}')
          valid = (
              (pr.get('state') == 'open' or (pr.get('state') == 'closed' and pr.get('merged')))
              and not pr.get('draft')
              and pr.get('head', {}).get('sha') == sha
              and pr.get('head', {}).get('repo', {}).get('full_name') == repo
              and pr.get('base', {}).get('repo', {}).get('full_name') == repo
              and pr.get('base', {}).get('ref') == 'master'
          )
          if not valid:
              raise SystemExit('Rejected: PR is stale, draft, fork-origin, or targets a different base.')
          print(f'Validated {repo}#{number} at {sha}.')
          PY
      - name: Assemble affected variants and run kernel checks
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.event.client_payload.child_repo || github.event.client_payload.repository }}
          SOURCE_SHA: ${{ inputs.sha || github.event.client_payload.head_sha || github.event.client_payload.sha }}
        run: |
          uv run --no-project --python 3.11 python check_commit.py \
            --repository "$SOURCE_REPOSITORY" --sha "$SOURCE_SHA" \
            --work "$GITHUB_WORKSPACE/tmp/check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Merge checked PR and synchronize variant pointers
        id: promote
        if: success() && github.event_name == 'repository_dispatch' && github.event.action != 'atelier_check'
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          RESULT_FILE: ${{ github.workspace }}/tmp/check-${{ github.run_id }}-${{ github.run_attempt }}/result.json
        run: python promote_pr.py
      - name: Return result summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.repository || github.event.client_payload.child_repo || github.event.client_payload.repository }}
          SOURCE_SHA: ${{ inputs.sha || github.event.client_payload.head_sha || github.event.client_payload.sha }}
          SOURCE_PR: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          RESULT_FILE: ${{ github.workspace }}/tmp/check-${{ github.run_id }}-${{ github.run_attempt }}/result.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request

          path = Path(os.environ['RESULT_FILE'])
          lines = ['# Commit assembly check']
          promotion = os.environ.get('PROMOTION_OUTCOME', 'skipped')
          if promotion != 'skipped':
              lines.append(f'Promotion: {promotion}')
          result = None
          if not path.exists():
              lines.append('Preparation failed; see job log.')
          else:
              result = json.loads(path.read_text())
              lines += [f"Source: `{result['repository']}@{result['source_sha']}`",
                        f"Success: {result['success']}"]
              if result.get('error'):
                  lines.append(result['error'])
              for variant in result['variants']:
                  state = 'skipped' if 'skipped' in variant else 'PASS' if variant.get('success') else 'FAIL'
                  lines.append(f"- {variant['repository']}: {state}")
                  if variant.get('error'):
                      lines.append(variant['error'])
                  for check in variant['checks']:
                      lines.append(f"  - {' '.join(check['command'])}: exit {check['exit_code']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')

          repository = os.environ.get('SOURCE_REPOSITORY', '')
          number = os.environ.get('SOURCE_PR', '')
          if not re.fullmatch(r'NomadAnget/atelier-[A-Za-z0-9_.-]+', repository) or not number.isdigit():
              print('No valid source PR was supplied; result remains in the Actions summary.')
              raise SystemExit(0)

          success = bool(result and result.get('success'))
          title = '✅ Atelier kernel check passed' if success else '❌ Atelier kernel check failed'
          body = [
              '<!-- atelier-sync-check-result -->',
              f'## {title}',
              f'Source: `{repository}@{os.environ.get("SOURCE_SHA", "")}`',
              f'Central run: [View check details]({os.environ["RUN_URL"]})',
              '',
          ]
          if result:
              for variant in result['variants']:
                  state = 'SKIPPED' if 'skipped' in variant else 'PASS' if variant.get('success') else 'FAIL'
                  body.append(f"- **{variant['repository']}**: {state}")
                  if variant.get('error'):
                      body.append(f"  - {variant['error']}")
                  for check in variant['checks']:
                      if check['exit_code'] != 0:
                          body.append(f"  - `{' '.join(check['command'])}` exited with {check['exit_code']}")
                          log = path.parent / (variant['repository'].split('/')[-1] + '-runtime') / 'constitution.log'
                          if 'atelier_core.discipline' in ' '.join(check['command']) and log.exists():
                              excerpt = log.read_text(errors='replace')[-1800:].strip()
                              if excerpt:
                                  body += ['', '<details><summary>Failure output</summary>', '', '```text', excerpt, '```', '', '</details>']
          else:
              body.append('The central workflow could not prepare the check report. See the run log.')

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/{number}/comments',
              data=json.dumps({'body': '\n'.join(body)}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Posted check summary to {repository}#{number} (HTTP {response.status}).")
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              print(f"Could not post summary to source PR; check result is still available in the Actions summary: {exc}")
          PY
